name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------ Payment Request
  payment:
    name: application · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The material screens import material/packages/shared, which uses zod from here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      # `npm test` builds first, then runs tests/*.test.mjs against the build.
      - run: npm test

  # -------------------------------------------------------- Material Management
  material:
    name: material · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: material
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: material/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # API tests start their own Mongo replica set (mongodb-memory-server) and
      # include the single sign-on tests against a stand-in Payment app.
      - run: pnpm test
      - run: pnpm build

  # ------------------------------------------------ images and the gateway config
  images:
    name: docker images · gateway config
    runs-on: ubuntu-latest
    needs: [payment, material]
    steps:
      - uses: actions/checkout@v4
      - name: env files for compose
        run: |
          cp env/payment.env.example env/payment.env
          cp env/material.env.example env/material.env
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - run: docker compose build
      - name: nginx configs parse
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=test \
            -keyout /tmp/certs/privkey.pem -out /tmp/certs/fullchain.pem
          for conf in nginx.conf nginx.tls.conf; do
            docker run --rm \
              --add-host payment:127.0.0.1 --add-host material-api:127.0.0.1 \
              -v "$PWD/gateway/$conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/gateway/routes.conf:/etc/nginx/gateway/routes.conf:ro" \
              -v /tmp/certs:/etc/nginx/certs:ro \
              nginx:1.27-alpine nginx -t
          done

  # ------------------------------------------------------------------- deploy
  # Runs on main once the repository variable DEPLOY_ENABLED is "true" and these
  # secrets exist: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR (the checkout on
  # the server, which holds env/*.env and gateway/certs - never in git).
  deploy:
    name: deploy to VPS
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
            docker compose ps
