# HTTPS. Certificates: ./gateway/certs/fullchain.pem and privkey.pem (e.g. from certbot).
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Payment attachments go up to 15 MB; Material uploads are smaller.
  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/csv;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

  upstream payment      { server payment:8787; }
  upstream material_api { server material-api:4000; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    include /etc/nginx/gateway/routes.conf;
  }
}
