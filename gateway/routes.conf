# Shared by nginx.conf (HTTP) and nginx.tls.conf (HTTPS). Same routing as dev-gateway.mjs.

# Material API: /material/api/x -> /api/x. Express trusts exactly this one hop.
location /material/api/ {
  proxy_pass http://material_api/api/;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_read_timeout 120s;
}

# Everything else: the application (payment and material screens).
location / {
  proxy_pass http://payment;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;
  proxy_read_timeout 120s;
}
