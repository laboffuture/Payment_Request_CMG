# HTTP only. For a first look on the server; sign-in needs HTTPS (the session
# cookies are Secure), so production uses nginx.tls.conf.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # Payment attachments go up to 15 MB; Material uploads are smaller.
  client_max_body_size 20m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/csv;
  gzip_min_length 1024;

  map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

  upstream payment      { server payment:8787; }
  upstream material_api { server material-api:4000; }

  server {
    listen 80;
    server_name _;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    include /etc/nginx/gateway/routes.conf;
  }
}
