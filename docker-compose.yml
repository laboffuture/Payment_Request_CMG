# The merged system: Payment Request + Material Management behind one gateway.
#
#   cp env/payment.env.example  env/payment.env    # fill in
#   cp env/material.env.example env/material.env   # fill in (same INTEGRATION_TOKEN in both)
#   docker compose up -d --build                   # http://<server>:8080   (first look)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build   # HTTPS
#
# One application: payment and material screens are served by the `payment` service;
# Material's rules run in `material-api` (+ worker, Mongo, Redis) behind /material/api.
# Only the gateway publishes a port.

name: cmg-platform

services:
  # ---------------------------------------------------------------- Payment Request
  payment:
    build:
      context: .
      dockerfile: docker/payment.Dockerfile
    restart: unless-stopped
    env_file: env/payment.env
    volumes:
      - payment-data:/data          # D1 database + R2 attachments
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/auth/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ------------------------------------------------------------ Material Management
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Single-node replica set: Material's writes are multi-document transactions.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok } catch (e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok
          }"
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  material-api:
    build:
      context: ./material
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: env/material.env
    environment:
      MONGO_URI: mongodb://mongo:27017/chandramari_material?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      PORT: 4000
      PUBLIC_BASE_PATH: /material
      APP_URL: ${APP_URL:-http://localhost:8080}
      PAYMENT_INTERNAL_URL: http://payment:8787
      PAYMENT_APP_BASE_URL: http://payment:8787
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      payment: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  material-worker:
    build:
      context: ./material
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file: env/material.env
    environment:
      MONGO_URI: mongodb://mongo:27017/chandramari_material?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      PAYMENT_APP_BASE_URL: http://payment:8787
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ------------------------------------------------------------------- the one door
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/routes.conf:/etc/nginx/gateway/routes.conf:ro
    depends_on:
      - payment
      - material-api

volumes:
  payment-data:
  mongo-data:
  redis-data:
